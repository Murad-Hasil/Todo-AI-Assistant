name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── Job 1: CLI unit tests ──────────────────────────────────────────────────
  cli-tests:
    name: CLI Tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dev dependencies
        working-directory: todo-cli
        run: uv sync --dev

      - name: Run tests
        working-directory: todo-cli
        run: uv run pytest tests/ -v

  # ── Job 2: Frontend lint + type-check ─────────────────────────────────────
  frontend-lint:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: todo-web-app/frontend/package-lock.json

      - name: Install dependencies
        working-directory: todo-web-app/frontend
        run: npm ci --legacy-peer-deps

      - name: TypeScript type check
        working-directory: todo-web-app/frontend
        run: npx tsc --noEmit

  # ── Job 3: Backend syntax check ───────────────────────────────────────────
  backend-syntax:
    name: Backend Syntax Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check Python syntax (no imports — secrets not required)
        working-directory: todo-web-app/backend
        run: python -m compileall app/ -q
